[build-system]
requires = ["setuptools>=64",
            "setuptools_scm[toml]>=7",
            "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "integgui2"
description = "Provides the IntegGUI2 GUI for Subaru Telescope."
readme = "README.md"
authors = [
    {name = "Software Division, Subaru Telescope, NAOJ", email = "ocs@naoj.org"},
]
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=5.3.1",
    "ginga>=5.4.0",
]
dynamic = ["version"]

[tool.setuptools]
zip-safe = false
include-package-data = false
# integgui2 is a plain script file (not a console-script entry point)
script-files = ["scripts/integgui2"]

[tool.setuptools.packages.find]
include = ["integgui2*"]

[tool.setuptools.package-data]
"integgui2.icons" = ["*.svg", "*.png"]

[tool.setuptools_scm]
write_to = "integgui2/version.py"
version_scheme = "release-branch-semver"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# match flake8's coverage: pycodestyle (E/W) + pyflakes (F)
select = ["E", "F", "W"]
ignore = [
    "E265",  # block comment should start with '# '
    "E266",  # too many leading '#' for block comment
    "E401",  # multiple imports on one line
    "E402",  # module level import not at top of file
    "E501",  # line too long
    "E741",  # ambiguous variable name 'l'
    "F841",  # local variable assigned to but never used
]
